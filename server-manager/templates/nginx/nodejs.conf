upstream __DOMAIN___backend {
    server 127.0.0.1:__NODE_PORT__;
    keepalive 64;
}

server {
    listen       80;
    listen       [::]:80;

    #SERVER_NAME
    server_name  __DOMAIN__ www.__DOMAIN__;

    #NGINX_LOG
    access_log /home/__OWNER_FOLDER__/__DOMAIN__/logs/access/access.log main;
    error_log /home/__OWNER_FOLDER__/__DOMAIN__/logs/errors/error.log;

    if ($host !~* ^(__DOMAIN__(:[0-9]+)?|www.__DOMAIN__(:[0-9]+)?)$) {
        return 404;
    }

    if ($is_bad_ua = 1) {
        return 444;
    }

    include /etc/nginx/well-known.conf;

    #HTTP_TO_HTTPS

    #BASIC_AUTH

    location /_next/static/ {
        alias /home/__OWNER_FOLDER__/__DOMAIN__/public_html/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /home/__OWNER_FOLDER__/__DOMAIN__/public_html/public/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://__DOMAIN___backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

